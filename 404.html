<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Jack Roy</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages only serves real files. A direct hit on a path
      // like /spatial/thistles has no matching file, so GitHub Pages
      // serves this 404.html instead. This script re-encodes that
      // path into a query string and redirects to the real
      // index.html, which decodes it and restores the clean URL
      // (see the matching script in index.html's <head>).
      //
      // If your site lives at a GitHub subpath, e.g.
      // username.github.io/repo-name/, change the 0 below to 1.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
