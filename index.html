    function isMobile() {
      return window.matchMedia("(max-width: 768px)").matches;
    }

    let currentCategory = null;
    let currentProjectIndex = null;

    let mobileMenuOpen = isMobile();
    let mobileMode = isMobile() ? "landing" : "desktop";

    function clearEditorialOverlay() {
      editorialOverlay.innerHTML = "";
    }

    function renderFooter() {
      return `
        <footer class="site-footer">
          <div class="footer-col footer-col-1">
            © 2026 Jack Roy<br>
            All rights reserved.
          </div>

          <div class="footer-col footer-col-2">
            <a
              class="footer-link"
              href="mailto:contact@jackroy.co"
            >Email</a><br>

            <a
              class="footer-link"
              href="https://www.linkedin.com/in/jackroy/"
              target="_blank"
              rel="noreferrer"
            >LinkedIn</a><br>

            <a
              class="footer-link"
              href="https://www.instagram.com/rackjoy/"
              target="_blank"
              rel="noreferrer"
            >@rackjoy</a>

          <div class="footer-col footer-col-3">
            275 Broome Street<br>
            New York, NY 10002
          </div>
        </footer>
      `;

    function goToStaticPage(page) {
      currentCategory = null;
      currentProjectIndex = null;
      previousMobileCategory = null;
      activeSprinkleColors =
        defaultSprinkleColors;

      clearEditorialOverlay();

      renderProjects(false);
      renderStaticPage(page);
      updateCategoryButtons();
      updateMobileMenuUI();
    }

    function bindFooterLinks() {
      document
        .querySelectorAll(".footer-link[data-page]")
        .forEach((button) => {
          button.addEventListener("click", () => {
            goToStaticPage(
              button.dataset.page
            );
          });
        });
    }

    function applyStaggerDelays(
      items,
      step = 0.05,
      start = 0.05
    ) {
      items.forEach((item, i) => {
        item.style.setProperty(
          "--item-delay",
          `${start + i * step}s`
        );
      });
    }

    function renderStaticPage(page) {
      clearEditorialOverlay();

      projectGallery.innerHTML = `
        <div class="text-page-layout shift-right">
          ${staticPages[page]}
        </div>

        <div class="footer-spacer"></div>

        ${renderFooter()}
      `;

      projectGallery.className =
        "project-gallery";

      projectGallery.scrollTop = 0;

      bindFooterLinks();

      if (page === "services") {
        applyStaggerDelays(
          projectGallery.querySelectorAll(
            ".services-list li"
          )
        );
      }
    }

    function applyImageFade() {
      const images =
        projectGallery.querySelectorAll("img");

      images.forEach((img) => {
        img.classList.remove("is-loaded");

        if (img.complete) {
          requestAnimationFrame(() => {
            img.classList.add("is-loaded");
          });
        } else {
          img.addEventListener(
            "load",
            () => {
              img.classList.add("is-loaded");
            },
            { once: true }
          );
        }
      });
    }

    function updateCategoryButtons() {
      categoryButtons.forEach((btn) => {
        btn.classList.toggle(
          "active",
          btn.dataset.category ===
            currentCategory &&
            currentProjectIndex !== null
        );

        btn.classList.toggle(
          "selected-category",
          btn.dataset.category ===
            currentCategory &&
            currentProjectIndex === null
        );
      });
    }

    function updateMobileStates() {
      if (!isMobile()) {
        document.body.classList.remove(
          "mobile-landing",
          "mobile-category-list",
          "mobile-project-open",
          "mobile-menu-open"
        );

        return;
      }

      document.body.classList.toggle(
        "mobile-landing",
        mobileMode === "landing"
      );

      document.body.classList.toggle(
        "mobile-category-list",
        mobileMode === "category"
      );

      document.body.classList.toggle(
        "mobile-project-open",
        mobileMode === "project"
      );

      document.body.classList.toggle(
        "mobile-menu-open",
        mobileMenuOpen
      );

      mobileMenuButton.setAttribute(
        "aria-expanded",
        String(mobileMenuOpen)
      );
    }

    function updateMobileMenuUI() {
      if (!isMobile()) {
        navPanel.classList.remove("open");
        mobileBackdrop.classList.remove("open");
        mobileMenuButton.classList.remove("open");

        updateMobileStates();

        return;
      }

      const shouldShowHamburger =
        mobileMode === "project";

      mobileMenuButton.classList.toggle(
        "is-visible",
        shouldShowHamburger
      );

      navPanel.classList.toggle(
        "open",
        mobileMenuOpen
      );

      mobileBackdrop.classList.toggle(
        "open",
        mobileMenuOpen &&
          mobileMode === "project"
      );

      mobileMenuButton.classList.toggle(
        "open",
        mobileMenuOpen &&
          mobileMode === "project"
      );

      updateMobileStates();
    }

    function openMobileMenu() {
      if (!isMobile()) return;

      mobileMenuOpen = true;
      updateMobileMenuUI();
    }

    function closeMobileMenu() {
      if (!isMobile()) return;

      mobileMenuOpen = false;
      updateMobileMenuUI();
    }

    function goToMobileLanding() {
      currentCategory = null;
      currentProjectIndex = null;
      previousMobileCategory = null;

      mobileMode = "landing";
      mobileMenuOpen = false;

      clearEditorialOverlay();

      renderProjects(false);
      renderGallery();
      updateCategoryButtons();
      updateMobileMenuUI();
    }

    function goToMobileCategory(category) {
      currentCategory = category;
      currentProjectIndex = null;
      previousMobileCategory = category;

      mobileMode = "category";
      mobileMenuOpen = false;

      clearEditorialOverlay();

      renderProjects(false);
      renderGallery();
      updateCategoryButtons();
      updateMobileMenuUI();
    }

    function openMobileProject(
      category,
      index
    ) {
      currentCategory = category;
      currentProjectIndex = index;
      previousMobileCategory = category;

      mobileMode = "project";
      mobileMenuOpen = false;

      clearEditorialOverlay();

      renderProjects(false);
      renderGallery();
      updateCategoryButtons();
      updateMobileMenuUI();
    }

    function renderCaptionContent(
      img,
      extraClass = ""
    ) {
      if (img.captionHtml) {
        return `
          <div class="${extraClass}">
            ${img.captionHtml}
          </div>
        `;
      }

      if (img.caption) {
        return `
          <div class="caption ${extraClass}">
            ${img.caption}
          </div>
        `;
      }

      return "";
    }

    function renderProjects(animate = false) {
      projectList.innerHTML = "";

      if (!currentCategory) return;

      const projects =
        portfolioData[currentCategory];

      projects
        .slice()
        .reverse()
        .forEach((project, i) => {
          const index =
            projects.length - 1 - i;

          const button =
            document.createElement("button");

          button.className =
            "project-link";

          button.type = "button";

          if (
            index === currentProjectIndex
          ) {
            button.classList.add("active");
          }

          if (!animate) {
            button.classList.add(
              "is-visible"
            );
          }

          button.innerHTML = `
            <span class="project-title">
              ${project.title}
            </span>

            <span class="project-year">
              ${project.year}
            </span>
          `;

          button.addEventListener(
            "click",
            () => {
              if (isMobile()) {
                openMobileProject(
                  currentCategory,
                  index
                );
              } else {
                currentProjectIndex =
                  index;

                renderProjects(false);
                renderGallery();
                updateCategoryButtons();
              }
            }
          );

          projectList.appendChild(button);

          if (animate) {
            setTimeout(() => {
              button.classList.add(
                "is-visible"
              );
            }, i * 60);
          }
        });
    }

    function renderRightStack(project) {
      return `
        <div class="gallery-right">
          ${project.images
            .map(
              (img) => `
                <div class="gallery-item">
                  <img src="${img.src}" alt="">
                  ${renderCaptionContent(img)}
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    function renderRandomScatter(project) {
      const slots = [
        {
          top: 8,
          left: 8,
          width: 18
        },
        {
          top: 18,
          left: 34,
          width: 16
        },
        {
          top: 36,
          left: 58,
          width: 20
        },
        {
          top: 54,
          left: 78,
          width: 17
        }
      ];

      const shuffled =
        [...slots].sort(
          () => Math.random() - 0.5
        );

      return `
        <div class="gallery-random">
          ${project.images
            .map((img, i) => {
              const slot =
                shuffled[
                  i % shuffled.length
                ];

              const topJitter =
                Math.floor(
                  Math.random() * 4 - 2
                );

              const leftJitter =
                Math.floor(
                  Math.random() * 5 - 2
                );

              const widthJitter =
                Math.floor(
                  Math.random() * 3 - 1
                );

              const rotation =
                Math.floor(
                  Math.random() * 8 - 4
                );

              return `
                <img
                  src="${img.src}"
                  class="random-img"
                  alt=""
                  style="
                    top:${slot.top + topJitter}%;
                    left:${slot.left + leftJitter}%;
                    width:${slot.width + widthJitter}vw;
                    transform: rotate(${rotation}deg);
                    z-index:${i + 1};
                  "
                >
              `;
            })
            .join("")}
        </div>
      `;
    }

    function renderCenteredLarge(project) {
      return `
        <div class="gallery-centered-large">
          ${project.images
            .map(
              (img) => `
                <div class="gallery-item centered-large-item">
                  <img src="${img.src}" alt="">
                  ${renderCaptionContent(img)}
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    /*
      IMPORTANT:
      The images are rendered inside the scrolling gallery.
      The text is NOT rendered here anymore.
      It is rendered into #editorial-overlay instead.
    */
    function renderEditorialScrollOverlay(project) {
      return `
        <div class="gallery-editorial-scroll">
          ${project.images
            .map(
              (img) => `
                <div class="editorial-item">
                  <img
                    src="${img.src}"
                    alt=""
                    class="wynn-image"
                  >
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    function renderEditorialOverlay(project) {
      if (
        !project.overlayText ||
        !project.overlayText.length
      ) {
        return "";
      }

      return `
        <div class="fixed-text-paragraph">
          ${project.overlayText
            .map((p, i) => {
              if (i === 0) {
                return `
                  <p class="editorial-overlay-title">
                    ${p}
                  </p>
                `;
              }

              return `<p>${p}</p>`;
            })
            .join("")}
        </div>
      `;
    }

    function renderTwoColumnGrid(project) {
      return `
        <div class="gallery-two-grid">
          ${project.images
            .map(
              (img) => `
                <div class="grid-item">
                  <img src="${img.src}" alt="">
                  ${renderCaptionContent(
                    img,
                    "caption-below"
                  )}
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    function renderStaggeredStack(project) {
      return `
        <div class="gallery-staggered">
          ${project.images
            .map(
              (img, i) => `
                <div class="gallery-item stagger-${i}">
                  <img src="${img.src}" alt="">
                  ${renderCaptionContent(img)}
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    function renderSingleMonument(project) {
      return `
        <div class="gallery-monument">
          ${project.images
            .map(
              (img) => `
                <div class="gallery-item monument-item">
                  <img src="${img.src}" alt="">
                  ${renderCaptionContent(img)}
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    function renderCaptionLed(project) {
      return `
        <div class="gallery-caption-led">
          ${project.images
            .map(
              (img) => `
                <div class="caption-led-item">
                  <img src="${img.src}" alt="">
                  ${renderCaptionContent(
                    img,
                    "caption-wide"
                  )}
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    function renderDiptych(project) {
      return `
        <div class="gallery-diptych">
          ${project.images
            .map(
              (img) => `
                <div class="diptych-item">
                  <img src="${img.src}" alt="">
                  ${renderCaptionContent(
                    img,
                    "caption-below"
                  )}
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    function renderTextPage(project) {
      return `
        <div class="text-effect-wrap">
          <p>${project.text}</p>
        </div>
      `;
    }

    function renderMobileLinear(project) {
      if (
        project.layout === "text-page"
      ) {
        return `
          <div class="gallery-mobile-linear text-only">
            <div class="mobile-linear-item">
              <div class="text-effect-wrap mobile-text-wrap">
                <p>${project.text}</p>
              </div>
            </div>
          </div>
        `;
      }

      if (
        project.layout ===
        "editorial-scroll-overlay"
      ) {
        return `
          <div class="gallery-mobile-linear">
            <div class="mobile-editorial-text">
              ${project.overlayText
                .map(
                  (p, i) => {
                    if (i === 0) {
                      return `
                        <p class="editorial-overlay-title">
                          ${p}
                        </p>
                      `;
                    }

                    return `<p>${p}</p>`;
                  }
                )
                .join("")}
            </div>

            ${project.images
              .map(
                (img) => `
                  <div class="mobile-linear-item">
                    <img
                      src="${img.src}"
                      alt=""
                      class="wynn-image"
                    >
                  </div>
                `
              )
              .join("")}
          </div>
        `;
      }

      return `
        <div class="gallery-mobile-linear">
          ${project.images
            .map(
              (img) => `
                <div class="mobile-linear-item">
                  <img src="${img.src}" alt="">
                  ${renderCaptionContent(
                    img,
                    "mobile-caption"
                  )}
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    function attachWynnImageToggle() {
      const wynnImages =
        projectGallery.querySelectorAll(
          ".wynn-image"
        );

      wynnImages.forEach((img) => {
        img.addEventListener(
          "click",
          () => {
            img.classList.toggle(
              "is-color"
            );
          }
        );
      });
    }

    function renderGallery() {
      clearEditorialOverlay();

      if (
        currentProjectIndex === null ||
        !currentCategory
      ) {
        activeSprinkleColors =
          defaultSprinkleColors;

        projectGallery.innerHTML = `
          <div class="home-footer-spacer"></div>
          ${renderFooter()}
        `;

        projectGallery.className =
          "project-gallery";

        projectGallery.scrollTop = 0;

        bindFooterLinks();

        return;
      }

      const project =
        portfolioData[currentCategory][
          currentProjectIndex
        ];

      activeSprinkleColors =
        project.sprinkleColors ||
        defaultSprinkleColors;

      projectGallery.className =
        "project-gallery";

      if (isMobile()) {
        projectGallery.innerHTML =
          renderMobileLinear(project);

        if (
          project.layout ===
          "editorial-scroll-overlay"
        ) {
          attachWynnImageToggle();
        }

        projectGallery.insertAdjacentHTML(
          "beforeend",
          renderFooter()
        );

        projectGallery.scrollTop = 0;

        bindFooterLinks();
        applyImageFade();

        return;
      }

      if (
        project.layout ===
        "right-stack"
      ) {
        projectGallery.innerHTML =
          renderRightStack(project);

      } else if (
        project.layout ===
        "right-stack-small"
      ) {
        projectGallery.classList.add(
          "small-mode",
          "no-top-gap-right"
        );

        projectGallery.innerHTML =
          renderRightStack(project);

      } else if (
        project.layout ===
        "random-scatter"
      ) {
        projectGallery.classList.add(
          "glassons-lock"
        );

        projectGallery.innerHTML =
          renderRandomScatter(project);

      } else if (
        project.layout ===
        "centered-large"
      ) {
        projectGallery.innerHTML =
          renderCenteredLarge(project);

      } else if (
        project.layout ===
        "editorial-scroll-overlay"
      ) {
        projectGallery.innerHTML =
          renderEditorialScrollOverlay(
            project
          );

        editorialOverlay.innerHTML =
          renderEditorialOverlay(
            project
          );

        attachWynnImageToggle();

      } else if (
        project.layout ===
        "two-column-grid"
      ) {
        projectGallery.innerHTML =
          renderTwoColumnGrid(project);

      } else if (
        project.layout ===
        "staggered-stack"
      ) {
        projectGallery.innerHTML =
          renderStaggeredStack(project);

      } else if (
        project.layout ===
        "single-monument"
      ) {
        projectGallery.classList.add(
          "no-top-gap-monument"
        );

        projectGallery.innerHTML =
          renderSingleMonument(project);

      } else if (
        project.layout ===
        "caption-led"
      ) {
        projectGallery.innerHTML =
          renderCaptionLed(project);

      } else if (
        project.layout ===
        "diptych"
      ) {
        projectGallery.innerHTML =
          renderDiptych(project);

      } else if (
        project.layout ===
        "text-page"
      ) {
        projectGallery.innerHTML =
          renderTextPage(project);

      } else {
        projectGallery.innerHTML = "";
      }

      projectGallery.insertAdjacentHTML(
        "beforeend",
        renderFooter()
      );

      projectGallery.scrollTop = 0;

      bindFooterLinks();
      applyImageFade();
    }

    categoryButtons.forEach((btn) => {
      btn.addEventListener(
        "click",
        () => {
          const selectedCategory =
            btn.dataset.category;

          if (isMobile()) {
            if (
              mobileMode === "landing"
            ) {
              goToMobileCategory(
                selectedCategory
              );

            } else if (
              mobileMode === "category" ||
              mobileMode === "project"
            ) {
              goToMobileCategory(
                selectedCategory
              );

              openMobileMenu();
            }

          } else {
            currentCategory =
              selectedCategory;

            currentProjectIndex =
              portfolioData[
                currentCategory
              ].length - 1;

            renderProjects(true);
            renderGallery();
            updateCategoryButtons();
          }
        }
      );
    });

    homeButton.addEventListener(
      "click",
      () => {
        if (isMobile()) {
          goToMobileLanding();

        } else {
          currentCategory = null;
          currentProjectIndex = null;

          categoryButtons.forEach((b) => {
            b.classList.remove(
              "active",
              "selected-category"
            );
          });

          clearEditorialOverlay();

          renderProjects(false);
          renderGallery();
        }
      }
    );

    document
      .querySelectorAll(
        "#page-nav [data-page]"
      )
      .forEach((button) => {
        button.addEventListener(
          "click",
          () => {
            goToStaticPage(
              button.dataset.page
            );
          }
        );
      });

    mobileMenuButton.addEventListener(
      "click",
      () => {
        if (!isMobile()) return;

        mobileMenuOpen =
          !mobileMenuOpen;

        if (
          mobileMenuOpen &&
          !currentCategory &&
          previousMobileCategory
        ) {
          currentCategory =
            previousMobileCategory;

          renderProjects(false);
        }

        updateMobileMenuUI();
      }
    );

    mobileBackdrop.addEventListener(
      "click",
      () => {
        if (!isMobile()) return;

        closeMobileMenu();
      }
    );

    window.addEventListener(
      "mousemove",
      (e) => {
        if (cursorDot) {
          cursorDot.style.left =
            `${e.clientX}px`;

          cursorDot.style.top =
            `${e.clientY}px`;
        }
      }
    );

    const SPRINKLE_STEP = 10;

    function randomSprinkleColor() {
      return activeSprinkleColors[
        Math.floor(
          Math.random() *
            activeSprinkleColors.length
        )
      ];
    }

    function spawnSprinkle(x, y) {
      const sprinkle =
        document.createElement("div");

      sprinkle.className =
        "cursor-sprinkle";

      const size =
        4 + Math.random() * 3;

      sprinkle.style.left =
        `${x}px`;

      sprinkle.style.top =
        `${y}px`;

      sprinkle.style.setProperty(
        "--sprinkle-size",
        `${size}px`
      );

      sprinkle.style.background =
        randomSprinkleColor();

      sprinkle.style.setProperty(
        "--sprinkle-rotate",
        `${Math.floor(
          Math.random() * 360
        )}deg`
      );

      sprinkle.addEventListener(
        "animationend",
        () => sprinkle.remove()
      );

      document.body.appendChild(
        sprinkle
      );
    }

    let lastSprinkleX = null;
    let lastSprinkleY = null;

    window.addEventListener(
      "mousemove",
      (e) => {
        if (isMobile()) return;

        if (
          lastSprinkleX === null
        ) {
          lastSprinkleX =
            e.clientX;

          lastSprinkleY =
            e.clientY;

          spawnSprinkle(
            e.clientX,
            e.clientY
          );

          return;
        }

        const dx =
          e.clientX -
          lastSprinkleX;

        const dy =
          e.clientY -
          lastSprinkleY;

        const distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );

        if (
          distance >=
          SPRINKLE_STEP
        ) {
          const steps =
            Math.floor(
              distance /
                SPRINKLE_STEP
            );

          for (
            let i = 1;
            i <= steps;
            i++
          ) {
            const t =
              i / steps;

            spawnSprinkle(
              lastSprinkleX +
                dx * t,
              lastSprinkleY +
                dy * t
            );
          }

          lastSprinkleX =
            e.clientX;

          lastSprinkleY =
            e.clientY;
        }
      }
    );

    document.addEventListener(
      "click",
      (e) => {
        if (isMobile()) return;

        const burstCount = 8;

        for (
          let i = 0;
          i < burstCount;
          i++
        ) {
          const angle =
            (Math.PI * 2 * i) /
              burstCount +
            Math.random() *
              0.3;

          const distance =
            30 +
            Math.random() * 20;

          const bx =
            Math.cos(angle) *
            distance;

          const by =
            Math.sin(angle) *
            distance;

          const burst =
            document.createElement(
              "div"
            );

          burst.className =
            "cursor-sprinkle cursor-burst";

          const size =
            5 +
            Math.random() * 4;

          burst.style.left =
            `${e.clientX}px`;

          burst.style.top =
            `${e.clientY}px`;

          burst.style.setProperty(
            "--sprinkle-size",
            `${size}px`
          );

          burst.style.setProperty(
            "--burst-x",
            `${bx}px`
          );

          burst.style.setProperty(
            "--burst-y",
            `${by}px`
          );

          burst.style.background =
            randomSprinkleColor();

          burst.addEventListener(
            "animationend",
            () => burst.remove()
          );

          document.body.appendChild(
            burst
          );
        }
      }
    );

    function isInteractiveTarget(el) {
      return (
        el &&
        el.closest &&
        el.closest(
          "a, button, img"
        )
      );
    }

    function isTextTarget(el) {
      return (
        el &&
        el.closest &&
        el.closest(
          `
          p,
          .caption,
          .caption-below,
          .caption-wide,
          .editorial-caption,
          .indent,
          .bullet-list li,
          .mobile-caption,
          .fixed-text-paragraph,
          .mobile-editorial-text,
          .text-block p,
          .services-list li
          `
        )
      );
    }

    document.addEventListener(
      "mouseover",
      (e) => {
        if (!cursorDot) return;

        if (
          isInteractiveTarget(
            e.target
          )
        ) {
          cursorDot.classList.add(
            "is-hover"
          );

          cursorDot.classList.remove(
            "is-text"
          );

        } else if (
          isTextTarget(
            e.target
          )
        ) {
          cursorDot.classList.add(
            "is-text"
          );

          cursorDot.classList.remove(
            "is-hover"
          );

        } else {
          cursorDot.classList.remove(
            "is-hover",
            "is-text"
          );
        }
      }
    );

    document.addEventListener(
      "mouseout",
      (e) => {
        if (!cursorDot) return;

        if (
          isInteractiveTarget(
            e.target
          ) &&
          !isInteractiveTarget(
            e.relatedTarget
          )
        ) {
          cursorDot.classList.remove(
            "is-hover"
          );
        }

        if (
          isTextTarget(
            e.target
          ) &&
          !isTextTarget(
            e.relatedTarget
          )
        ) {
          cursorDot.classList.remove(
            "is-text"
          );
        }
      }
    );

    document.addEventListener(
      "contextmenu",
      (e) => {
        if (
          e.target.tagName ===
          "IMG"
        ) {
          e.preventDefault();
        }
      }
    );

    document.addEventListener(
      "dragstart",
      (e) => {
        if (
          e.target.tagName ===
          "IMG"
        ) {
          e.preventDefault();
        }
      }
    );

    window.addEventListener(
      "resize",
      () => {
        if (isMobile()) {
          if (
            mobileMode ===
            "desktop"
          ) {
            goToMobileLanding();

          } else {
            updateMobileMenuUI();
            renderProjects(false);
            renderGallery();
            updateCategoryButtons();
          }

        } else {
          mobileMode =
            "desktop";

          mobileMenuOpen =
            false;

          renderProjects(false);
          renderGallery();
          updateCategoryButtons();
          updateMobileMenuUI();
        }
      }
    );

    if (isMobile()) {
      goToMobileLanding();

    } else {
      renderProjects(true);
      renderGallery();
      updateCategoryButtons();
      updateMobileMenuUI();
    }
  </script>
</body>
</html>
